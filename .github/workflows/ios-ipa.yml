name: Build iOS IPA (unsigned)

on:
  workflow_dispatch: # bấm tay trong tab Actions
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # cần để tạo/cập nhật GitHub Release chứa file .ipa

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build iOS (no code signing)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        working-directory: app
        run: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Runner.ipa Payload
          ls -lh Runner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Runner-unsigned-ipa
          path: app/Runner.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release (link tải cố định)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: app
        run: |
          set -e
          TAG="ios-latest"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Runner.ipa --clobber
          else
            gh release create "$TAG" Runner.ipa \
              --title "iOS build mới nhất (unsigned .ipa)" \
              --notes "Bản build iOS mới nhất — chưa ký, cần Sideloadly/AltStore/ESign để cài lên iPhone. Tự động tạo bởi GitHub Actions."
          fi
          echo "Link tải trực tiếp: https://github.com/${{ github.repository }}/releases/download/$TAG/Runner.ipa"
          gh release view "$TAG" --json url --jq .url
