name: Build iOS IPA (unsigned)

on:
  workflow_dispatch: # bấm tay trong tab Actions
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios-ipa.yml'

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Build iOS (no code signing)
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package into .ipa
        working-directory: app
        run: |
          set -e
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          rm -rf Payload Runner.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Runner.ipa Payload
          ls -lh Runner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Runner-unsigned-ipa
          path: app/Runner.ipa
          if-no-files-found: error
          retention-days: 14
