name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Cần cho bước dọn các bản deploy cũ ở cuối job deploy:
  deployments: write # xoá các deployment cũ
  actions: write # xoá các artifact (bản build Pages) cũ

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # base-href phải khớp tên repo vì đây là "project site":
      # https://<user>.github.io/<repo>/
      - name: Build web (release)
        working-directory: app
        run: flutter build web --release --base-href "/cafe-price-widget/"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: app/build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      # Chỉ giữ DUY NHẤT bản deploy mới nhất: xoá các deployment cũ và các
      # artifact (bản build) của những lần deploy trước. Bước này lỗi cũng
      # KHÔNG làm hỏng lần deploy hiện tại (continue-on-error).
      - name: Dọn các bản deploy cũ
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          keep_dep=$(gh api "repos/$REPO/deployments?per_page=100" \
            --jq '[.[].id] | max')
          echo "Giữ lại deployment mới nhất: $keep_dep"
          for id in $(gh api "repos/$REPO/deployments?per_page=100" \
            --jq '[.[].id] | sort | reverse | .[]'); do
            if [ "$id" = "$keep_dep" ]; then continue; fi
            gh api --method POST "repos/$REPO/deployments/$id/statuses" \
              -f state=inactive >/dev/null 2>&1 || true
            gh api --method DELETE "repos/$REPO/deployments/$id" >/dev/null 2>&1 \
              && echo "  đã xoá deployment $id" \
              || echo "  bỏ qua deployment $id"
          done

          keep_art=$(gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="github-pages") | .id] | max')
          echo "Giữ lại artifact mới nhất: $keep_art"
          for id in $(gh api "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name=="github-pages") | .id] | sort | reverse | .[]'); do
            if [ "$id" = "$keep_art" ]; then continue; fi
            gh api --method DELETE "repos/$REPO/actions/artifacts/$id" \
              >/dev/null 2>&1 \
              && echo "  đã xoá artifact $id" \
              || echo "  bỏ qua artifact $id"
          done
